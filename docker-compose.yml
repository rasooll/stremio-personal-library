services:
  app:
    image: ghcr.io/rasooll/stremio-personal-library:${IMAGE_TAG:-v0.1.1}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${DOCKER_NODE_ENV:-production}
      PORT: 7000
      DATABASE_URL: /app/data/app.db
    ports:
      - "${HOST_PORT:-7000}:7000"
    volumes:
      - ./data:/app/data
      - ${MEDIA_HOST_PATH:-/mnt/media}:${MEDIA_CONTAINER_PATH:-/media}:ro
    healthcheck:
      test: ["CMD", "gosu", "node", "node", "-e", "fetch('http://localhost:7000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
